packages:
  - packages/*
  - apps/*
  - examples/*

allowBuilds:
  '@tailwindcss/oxide': false
  edgedriver: false
  esbuild: false
  geckodriver: false
  sharp: false
  # wranglerの依存。pages deployはAPIアップロードのみでworkerd実行は不要
  workerd: false

blockExoticSubdeps: true

catalog:
  '@tailwindcss/postcss': 4.3.3
  '@tailwindcss/vite': 4.3.3
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4
  '@vitejs/plugin-react': 6.0.5
  postcss: 8.5.23
  react: 19.2.6
  react-dom: 19.2.6
  tailwindcss: 4.3.3
  vite: 8.2.0
  vite-plus: 0.2.7
  vitest: 4.1.7

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - '@k8o/*'
  - 'storybook-addon-determinism'
  - 'storybook-addon-vrt'
  - 'tailwind-token-extractor'
  - 'vite-plus-inspector'

verifyDepsBeforeRun: install

versioning:
  changelog:
    storage: repository
