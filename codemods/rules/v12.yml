# @k8o/arte-odyssey v11 -> v12 migration rules (ast-grep).
#
# Every rewrite is scoped by JSX element name. Renaming an attribute by name
# alone would be wrong here: `type` is a real prop on Heading / Button /
# Popover, `value` is a real prop on CheckboxGroup / CheckboxCard / RadioCard,
# and `gray` is also a design-token palette name.
#
# Rules whose id starts with `v12-manual-` have no `fix`: they only report
# places the codemod cannot migrate mechanically. See ../README.md.

id: v12-checkbox-value-to-checked
language: tsx
severity: error
message: '`value` is now `checked` on Checkbox / Switch / CheckboxGroup.Item.'
note: |
  The controlled prop is a boolean, so it was renamed to match the DOM
  attribute. `<CheckboxGroup value={string[]}>`, `<CheckboxCard value={...}>`
  and `<RadioCard value={...}>` are unchanged and are not matched here.
rule:
  kind: property_identifier
  regex: ^value$
  inside:
    kind: jsx_attribute
    inside:
      any:
        - kind: jsx_opening_element
        - kind: jsx_self_closing_element
      has:
        field: name
        regex: ^(Checkbox|Switch|CheckboxGroup\.Item)$
fix: checked

---
id: v12-modal-type-to-placement
language: tsx
severity: error
message: '`<Modal type>` is now `<Modal placement>`.'
note: |
  The values (center / bottom / right / left) are unchanged. Only Modal is
  matched: `type` is a genuine prop on Heading ('h1'...'h6'), Button
  ('button' | 'submit') and Popover.Root ('dialog' | 'menu' | 'listbox').
rule:
  kind: property_identifier
  regex: ^type$
  inside:
    kind: jsx_attribute
    inside:
      any:
        - kind: jsx_opening_element
        - kind: jsx_self_closing_element
      has:
        field: name
        regex: ^Modal$
fix: placement

---
id: v12-button-color-gray-to-base
language: tsx
severity: error
message: "`<Button color=\"gray\">` is now `<Button color=\"base\">`."
note: |
  Only the `color` attribute of `<Button>` is rewritten. IconButton already
  used `base`, and the bare string `gray` is also a palette name in Tailwind
  class names, so a plain text replacement would be wrong.
rule:
  kind: string_fragment
  regex: ^gray$
  inside:
    kind: string
    inside:
      kind: jsx_attribute
      has:
        kind: property_identifier
        regex: ^color$
      inside:
        any:
          - kind: jsx_opening_element
          - kind: jsx_self_closing_element
        has:
          field: name
          regex: ^Button$
fix: base

---
id: v12-pagination-onpagechange-to-onchange
language: tsx
severity: error
message: '`<Pagination onPageChange>` is now `<Pagination onChange>`.'
note: |
  Renamed for consistency with Tabs / ListBox. The handler signature
  `(page: number) => void` is unchanged.
rule:
  kind: property_identifier
  regex: ^onPageChange$
  inside:
    kind: jsx_attribute
    inside:
      any:
        - kind: jsx_opening_element
        - kind: jsx_self_closing_element
      has:
        field: name
        regex: ^Pagination$
fix: onChange

---
id: v12-listbox-triggericon-to-icontrigger
language: tsx
severity: error
message: '`ListBox.TriggerIcon` is now `ListBox.IconTrigger`.'
note: Applies to both the opening and the closing tag.
rule:
  kind: member_expression
  regex: ^ListBox\.TriggerIcon$
  inside:
    any:
      - kind: jsx_opening_element
      - kind: jsx_self_closing_element
      - kind: jsx_closing_element
fix: ListBox.IconTrigger

---
# ---------------------------------------------------------------------------
# Report only: the codemod deliberately does not rewrite these.
# ---------------------------------------------------------------------------

id: v12-manual-listbox-option-shape
language: tsx
severity: warning
message: 'ListBox options are now `{ value, label }` (was `{ key, label }`).'
note: |
  Rewrite `key` to `value` by hand, and rename any variable that reads
  `option.key`. This is reported instead of fixed because an object literal
  with `key` / `label` is not necessarily a ListBox option -- and options
  that come from an API response or an untyped array cannot be found at all.
rule:
  kind: object
  all:
    - has:
        kind: pair
        has:
          field: key
          regex: ^('key'|"key"|key)$
    - has:
        kind: pair
        has:
          field: key
          regex: ^('label'|"label"|label)$

---
id: v12-manual-listbox-options-prop
language: tsx
severity: hint
message: 'Check that this `options` value is `{ value, label }[]`.'
note: |
  The array is not a literal here, so its shape cannot be inspected. If it is
  typed as `Option[]` TypeScript will flag it; if it comes from an API
  response typed as `any`, nothing will.
rule:
  kind: jsx_attribute
  has:
    kind: property_identifier
    regex: ^options$
  not:
    has:
      kind: jsx_expression
      has:
        kind: array
  inside:
    any:
      - kind: jsx_opening_element
      - kind: jsx_self_closing_element
    has:
      field: name
      regex: ^ListBox\.Root$

---
id: v12-manual-radiocard-pressed-query
language: tsx
severity: warning
message: 'RadioCard no longer renders `button[aria-pressed]`.'
note: |
  It is a real `radiogroup` of `input[type=radio]` now. Replace
  `getByRole('button', { pressed })` with
  `getByRole('radio', { checked })`, and `getByRole('group')` with
  `getByRole('radiogroup')`.
rule:
  kind: call_expression
  all:
    - has:
        field: function
        regex: (get|find|query)(All)?ByRole$
    - has:
        field: arguments
        all:
          - has:
              kind: string
              regex: ^('button'|"button")$
          - has:
              kind: object
              has:
                kind: pair
                has:
                  field: key
                  regex: ^('pressed'|"pressed"|pressed)$

---
id: v12-manual-radiocard-usage
language: tsx
severity: hint
message: 'RadioCard now renders a radiogroup; its props are unchanged.'
note: |
  No prop change is needed, but the rendered DOM and the ARIA roles changed,
  so any test or CSS selector that targets this instance needs a look.
rule:
  any:
    - kind: jsx_opening_element
    - kind: jsx_self_closing_element
  has:
    field: name
    regex: ^RadioCard$

---
id: v12-manual-button-non-button-attribute
language: tsx
severity: warning
message: 'Button / IconButton props are `ButtonHTMLAttributes` now.'
note: |
  The props type was `HTMLProps` (= `AllHTMLAttributes`), which accepted
  attributes that a `<button>` never had. This attribute is now a type error
  even though the runtime behaviour is unchanged -- render the element
  yourself through `renderItem` instead.
rule:
  kind: jsx_attribute
  has:
    kind: property_identifier
    regex: ^(href|target|rel|download|hrefLang|ping|referrerPolicy|src|alt|htmlFor|action|method|readOnly|checked|selected|multiple|placeholder)$
  inside:
    any:
      - kind: jsx_opening_element
      - kind: jsx_self_closing_element
    has:
      field: name
      regex: ^(Button|IconButton)$

---
id: v12-manual-listbox-triggericon-outside-jsx
language: tsx
severity: warning
message: '`ListBox.TriggerIcon` is now `ListBox.IconTrigger`.'
note: |
  Only JSX tags are rewritten automatically. This reference is outside a JSX
  tag (an alias, a `ComponentProps<...>`, a story `component:` field, ...)
  so rename it by hand.
rule:
  kind: member_expression
  regex: ^ListBox\.TriggerIcon$
  not:
    inside:
      any:
        - kind: jsx_opening_element
        - kind: jsx_self_closing_element
        - kind: jsx_closing_element

---
id: v12-manual-aliased-import
language: tsx
severity: warning
message: 'This component is imported under an alias; the codemod will miss it.'
note: |
  Every rewrite is scoped by the JSX element name, so an aliased import hides
  the usage. Migrate those tags by hand, or drop the alias, re-run the
  codemod, and put the alias back.
rule:
  kind: import_specifier
  all:
    - has:
        field: alias
        kind: identifier
    - has:
        field: name
        regex: ^(Checkbox|CheckboxGroup|Switch|Modal|Button|IconButton|Pagination|ListBox|RadioCard)$
  inside:
    stopBy: end
    kind: import_statement
    has:
      field: source
      regex: '@k8o/arte-odyssey'
